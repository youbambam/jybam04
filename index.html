<script>
/* =========================================================
   JY CLOTHING BRAND
   3D HUMAN MODEL SYSTEM
   ========================================================= */

let scene, camera, renderer, controls;
let avatarGroup;
let shirtMesh;
let pantsMesh;
let buttonsGroup;

let selectedColorHex = '#ffffff';
let selectedColorName = 'ขาว';


/* =========================================================
   1. เริ่มต้นระบบ 3D
   ========================================================= */

function init3D() {

    const container = document.querySelector('.canvas-3d-wrapper');
    const canvas = document.getElementById('avatar-3d-canvas');

    if (!container || !canvas) {
        console.error('ไม่พบพื้นที่ 3D');
        return;
    }

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        45,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
    );

    camera.position.set(0, 1.7, 4.8);

    renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true
    });

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.shadowMap.enabled = true;

    /* พื้นหลัง */
    scene.background = new THREE.Color(0xf8f7ff);


    /* =====================================================
       แสง
       ===================================================== */

    const ambientLight =
        new THREE.AmbientLight(0xffffff, 0.8);

    scene.add(ambientLight);


    const keyLight =
        new THREE.DirectionalLight(0xffffff, 1.1);

    keyLight.position.set(3, 5, 4);

    keyLight.castShadow = true;

    scene.add(keyLight);


    const fillLight =
        new THREE.DirectionalLight(0xdbeafe, 0.6);

    fillLight.position.set(-3, 3, 2);

    scene.add(fillLight);


    const backLight =
        new THREE.DirectionalLight(0xf5d0fe, 0.5);

    backLight.position.set(0, 3, -4);

    scene.add(backLight);


    /* =====================================================
       Controls
       ===================================================== */

    controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.target.set(0, 1.55, 0);

    controls.minDistance = 2.5;

    controls.maxDistance = 7;

    controls.enablePan = false;


    /* =====================================================
       กลุ่มหุ่น
       ===================================================== */

    avatarGroup = new THREE.Group();

    scene.add(avatarGroup);


    build3DAvatarAndClothing();

    animate();


    window.addEventListener(
        'resize',
        onWindowResize
    );
}


/* =========================================================
   2. วัสดุผิว
   ========================================================= */

function createSkinMaterial() {

    return new THREE.MeshStandardMaterial({
        color: 0xf0b28c,
        roughness: 0.72,
        metalness: 0
    });

}


/* =========================================================
   3. สร้างทรงกระบอก
   ========================================================= */

function createCylinder(
    radiusTop,
    radiusBottom,
    height,
    color
) {

    const geometry =
        new THREE.CylinderGeometry(
            radiusTop,
            radiusBottom,
            height,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.65
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


/* =========================================================
   4. สร้างแขน
   ========================================================= */

function createArm(side) {

    const armGroup =
        new THREE.Group();

    const skin =
        createSkinMaterial();


    /* ต้นแขน */

    const upperArm =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.105,
                0.48,
                8,
                16
            ),
            skin
        );

    upperArm.position.y = -0.28;

    upperArm.rotation.z =
        side === 'left'
            ? -0.08
            : 0.08;

    armGroup.add(upperArm);


    /* ปลายแขน */

    const foreArm =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.09,
                0.42,
                8,
                16
            ),
            skin
        );

    foreArm.position.y = -0.72;

    armGroup.add(foreArm);


    /* มือ */

    const hand =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.13,
                20,
                20
            ),
            skin
        );

    hand.scale.set(
        0.8,
        1.25,
        0.7
    );

    hand.position.y = -1.03;

    armGroup.add(hand);


    armGroup.position.x =
        side === 'left'
            ? -0.67
            : 0.67;

    armGroup.position.y = 2.15;

    armGroup.rotation.z =
        side === 'left'
            ? -0.10
            : 0.10;

    return armGroup;
}


/* =========================================================
   5. สร้างขา
   ========================================================= */

function createLeg(side) {

    const legGroup =
        new THREE.Group();

    const skin =
        createSkinMaterial();


    /* ต้นขา */

    const thigh =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.17,
                0.72,
                8,
                20
            ),
            skin
        );

    thigh.position.y = -0.45;

    legGroup.add(thigh);


    /* น่อง */

    const calf =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                0.135,
                0.68,
                8,
                20
            ),
            skin
        );

    calf.position.y = -1.15;

    legGroup.add(calf);


    /* เท้า */

    const foot =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.22,
                20,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0x222222,
                roughness: 0.8
            })
        );

    foot.scale.set(
        1.35,
        0.55,
        1.9
    );

    foot.position.set(
        side === 'left'
            ? -0.02
            : 0.02,
        -1.75,
        0.12
    );

    legGroup.add(foot);


    legGroup.position.x =
        side === 'left'
            ? -0.22
            : 0.22;

    legGroup.position.y = 1.05;

    return legGroup;
}


/* =========================================================
   6. สร้างเสื้อ
   ========================================================= */

function createShirtModel(
    material,
    chestScale
) {

    const group =
        new THREE.Group();


    /* ตัวเสื้อ */

    const shirtBody =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.54 * chestScale,
                0.48 * chestScale,
                1.35,
                48
            ),
            material
        );

    shirtBody.scale.z = 0.78;

    shirtBody.position.y = 2.05;

    shirtBody.castShadow = true;

    group.add(shirtBody);


    /* ไหล่ซ้าย */

    const shoulderLeft =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.32,
                24,
                16
            ),
            material
        );

    shoulderLeft.scale.set(
        1.25,
        0.72,
        0.8
    );

    shoulderLeft.position.set(
        -0.58 * chestScale,
        2.55,
        0
    );

    group.add(shoulderLeft);


    /* ไหล่ขวา */

    const shoulderRight =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.32,
                24,
                16
            ),
            material
        );

    shoulderRight.scale.set(
        1.25,
        0.72,
        0.8
    );

    shoulderRight.position.set(
        0.58 * chestScale,
        2.55,
        0
    );

    group.add(shoulderRight);


    /* แขนเสื้อ */

    const sleeveStyle =
        document.getElementById(
            'sleeve-style'
        )?.value || 'short';


    if (sleeveStyle === 'short') {

        createSleeve(
            group,
            material,
            -0.70 * chestScale,
            2.30,
            0.35
        );

        createSleeve(
            group,
            material,
            0.70 * chestScale,
            2.30,
            0.35
        );

    }


    if (sleeveStyle === 'long') {

        createSleeve(
            group,
            material,
            -0.70 * chestScale,
            2.10,
            0.75
        );

        createSleeve(
            group,
            material,
            0.70 * chestScale,
            2.10,
            0.75
        );

    }


    /* คอเสื้อ */

    createCollar(
        group,
        material
    );


    return group;
}


/* =========================================================
   7. แขนเสื้อ
   ========================================================= */

function createSleeve(
    group,
    material,
    x,
    y,
    height
) {

    const sleeve =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.18,
                0.15,
                height,
                32
            ),
            material
        );

    sleeve.position.set(
        x,
        y,
        0
    );

    sleeve.rotation.z =
        x < 0
            ? -0.10
            : 0.10;

    sleeve.castShadow = true;

    group.add(sleeve);
}


/* =========================================================
   8. คอเสื้อ
   ========================================================= */

function createCollar(
    group,
    material
) {

    const collarStyle =
        document.getElementById(
            'collar-style'
        )?.value || 'round';


    if (collarStyle === 'round') {

        const collar =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    0.19,
                    0.045,
                    12,
                    32
                ),
                material
            );

        collar.position.y = 2.72;

        collar.rotation.x =
            Math.PI / 2;

        group.add(collar);

    }


    if (collarStyle === 'vneck') {

        const points = [
            new THREE.Vector3(
                -0.20,
                2.70,
                0.43
            ),
            new THREE.Vector3(
                0,
                2.48,
                0.43
            ),
            new THREE.Vector3(
                0.20,
                2.70,
                0.43
            )
        ];

        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(points);

        const line =
            new THREE.Line(
                geometry,
                new THREE.LineBasicMaterial({
                    color: 0x333333
                })
            );

        group.add(line);

    }


    if (collarStyle === 'polo') {

        const collar =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    0.22,
                    0.22,
                    0.12,
                    32
                ),
                material
            );

        collar.position.y = 2.70;

        group.add(collar);

    }

}


/* =========================================================
   9. สร้างกางเกง
   ========================================================= */

function createPantsModel(
    material,
    chestScale
) {

    const group =
        new THREE.Group();


    const style =
        document.getElementById(
            'pants-style-select'
        )?.value || '250';


    let height = 0.75;


    if (style === '250') {

        /* ขาสั้น */

        height = 0.75;

    }

    else if (style === '350') {

        /* สแล็คขายาว */

        height = 1.75;

    }

    else if (style === '400') {

        /* ลินินขายาว */

        height = 1.85;

    }

    else if (style === '450') {

        /* ยีนส์ */

        height = 1.85;

    }


    /* เอว */

    const waist =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.46 * chestScale,
                0.48 * chestScale,
                0.30,
                40
            ),
            material
        );

    waist.position.y = 1.30;

    group.add(waist);


    /* ขาซ้าย */

    const leftLeg =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.20,
                0.17,
                height,
                32
            ),
            material
        );

    leftLeg.position.set(
        -0.22,
        1.30 - height / 2,
        0
    );

    leftLeg.castShadow = true;

    group.add(leftLeg);


    /* ขาขวา */

    const rightLeg =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.20,
                0.17,
                height,
                32
            ),
            material
        );

    rightLeg.position.set(
        0.22,
        1.30 - height / 2,
        0
    );

    rightLeg.castShadow = true;

    group.add(rightLeg);


    return group;
}


/* =========================================================
   10. สร้างหุ่นคนทั้งหมด
   ========================================================= */

function build3DAvatarAndClothing() {

    if (!avatarGroup) return;


    /* ล้างของเดิม */

    while (
        avatarGroup.children.length > 0
    ) {

        const object =
            avatarGroup.children[0];

        avatarGroup.remove(object);

        object.traverse(
            function(child) {

                if (child.geometry) {
                    child.geometry.dispose();
                }

                if (child.material) {

                    if (Array.isArray(
                        child.material
                    )) {

                        child.material.forEach(
                            m => m.dispose()
                        );

                    }

                    else {
                        child.material.dispose();
                    }

                }

            }
        );
    }


    const skin =
        createSkinMaterial();


    /* =====================================================
       ลำตัว
       ===================================================== */

    const body =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.62,
                32,
                24
            ),
            skin
        );

    body.scale.set(
        0.85,
        1.45,
        0.52
    );

    body.position.y = 2.05;

    body.castShadow = true;

    avatarGroup.add(body);


    /* =====================================================
       คอ
       ===================================================== */

    const neck =
        createCylinder(
            0.16,
            0.17,
            0.22,
            0xf0b28c
        );

    neck.position.y = 2.78;

    avatarGroup.add(neck);


    /* =====================================================
       หัว
       ===================================================== */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.34,
                32,
                32
            ),
            skin
        );

    head.scale.set(
        0.88,
        1.12,
        0.88
    );

    head.position.y = 3.20;

    head.castShadow = true;

    avatarGroup.add(head);


    /* =====================================================
       ผม
       ===================================================== */

    const hair =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.36,
                32,
                20
            ),
            new THREE.MeshStandardMaterial({
                color: 0x241b18,
                roughness: 0.8
            })
        );

    hair.scale.set(
        1,
        0.62,
        1
    );

    hair.position.y = 3.42;

    avatarGroup.add(hair);


    /* =====================================================
       ตา
       ===================================================== */

    createEye(
        avatarGroup,
        -0.12,
        3.24,
        0.31
    );

    createEye(
        avatarGroup,
        0.12,
        3.24,
        0.31
    );


    /* =====================================================
       จมูก
       ===================================================== */

    const nose =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.035,
                12,
                12
            ),
            skin
        );

    nose.position.set(
        0,
        3.13,
        0.33
    );

    avatarGroup.add(nose);


    /* =====================================================
       สะโพก
       ===================================================== */

    const hips =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.48,
                32,
                24
            ),
            skin
        );

    hips.scale.set(
        1.0,
        0.62,
        0.60
    );

    hips.position.y = 1.30;

    avatarGroup.add(hips);


    /* =====================================================
       แขน
       ===================================================== */

    const leftArm =
        createArm('left');

    const rightArm =
        createArm('right');

    avatarGroup.add(leftArm);
    avatarGroup.add(rightArm);


    /* =====================================================
       ขา
       ===================================================== */

    const leftLeg =
        createLeg('left');

    const rightLeg =
        createLeg('right');

    avatarGroup.add(leftLeg);
    avatarGroup.add(rightLeg);


    /* =====================================================
       เสื้อ
       ===================================================== */

    const itemType =
        document.getElementById(
            'item-type-select'
        )?.value || 'full';


    const fabric =
        document.getElementById(
            'fabric-select'
        );


    const selectedFabric =
        fabric
            ? fabric.options[
                fabric.selectedIndex
            ]
            : null;


    const fabricName =
        selectedFabric
            ? selectedFabric.text
            : '';


    let shirtColor =
        new THREE.Color(
            selectedColorHex
        );


    /* ผ้ายีนส์ทำให้ดูเข้มขึ้นเล็กน้อย */

    if (
        fabricName
            .toLowerCase()
            .includes('denim')
    ) {

        shirtColor.multiplyScalar(0.82);

    }


    const shirtMaterial =
        new THREE.MeshStandardMaterial({
            color: shirtColor,
            roughness:
                fabricName
                    .toLowerCase()
                    .includes('satin')
                    ? 0.25
                    : 0.7,
            metalness:
                fabricName
                    .toLowerCase()
                    .includes('satin')
                    ? 0.08
                    : 0
        });


    if (
        itemType === 'full' ||
        itemType === 'shirt'
    ) {

        shirtMesh =
            createShirtModel(
                shirtMaterial,
                1
            );

        avatarGroup.add(
            shirtMesh
        );

    }


    /* =====================================================
       กางเกง
       ===================================================== */

    if (
        itemType === 'full' ||
        itemType === 'pants'
    ) {

        const pantsMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x242424,
                roughness: 0.75
            });

        pantsMesh =
            createPantsModel(
                pantsMaterial,
                1
            );

        avatarGroup.add(
            pantsMesh
        );

    }


    /* =====================================================
       กระดุม
       ===================================================== */

    buttonsGroup =
        new THREE.Group();

    avatarGroup.add(
        buttonsGroup
    );

    renderButtons();


    /* =====================================================
       ปรับขนาดหุ่น
       ===================================================== */

    updateAvatarShape();

}


/* =========================================================
   11. ดวงตา
   ========================================================= */

function createEye(
    group,
    x,
    y,
    z
) {

    const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.035,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0x222222
            })
        );

    eye.position.set(
        x,
        y,
        z
    );

    group.add(eye);
}


/* =========================================================
   12. กระดุม
   ========================================================= */

function renderButtons() {

    if (!buttonsGroup) return;


    while (
        buttonsGroup.children.length > 0
    ) {

        const child =
            buttonsGroup.children[0];

        buttonsGroup.remove(child);

    }


    const count =
        parseInt(
            document.getElementById(
                'button-count'
            )?.value || 0
        );


    if (count <= 0) return;


    const color =
        document.getElementById(
            'button-color-picker'
        )?.value || '#000000';


    const material =
        new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.35
        });


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const button =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    0.045,
                    16,
                    16
                ),
                material
            );


        button.scale.z = 0.35;


        const startY = 2.55;

        const spacing =
            count === 1
                ? 0
                : 0.75 /
                  (count - 1);


        button.position.set(
            0,
            startY -
                i * spacing,
            0.47
        );


        buttonsGroup.add(
            button
        );

    }

}


/* =========================================================
   13. อัปเดตโมเดลตามตัวเลือก
   ========================================================= */

function update3DFittingModel() {

    if (!scene || !avatarGroup)
        return;


    build3DAvatarAndClothing();


    /* อัปเดตราคา */

    if (
        typeof calculate3DPrice ===
        'function'
    ) {

        calculate3DPrice();

    }

}


/* =========================================================
   14. ปรับรูปร่างตามส่วนสูง / รอบอก
   ========================================================= */

function updateAvatarShape() {

    if (!avatarGroup) return;


    const heightInput =
        document.getElementById(
            'body-height'
        );

    const chestInput =
        document.getElementById(
            'body-chest'
        );


    const height =
        parseFloat(
            heightInput?.value || 175
        );


    const chest =
        parseFloat(
            chestInput?.value || 38
        );


    /* ส่วนสูง 150 - 200 */

    const heightScale =
        THREE.MathUtils.clamp(
            height / 175,
            0.86,
            1.14
        );


    /* รอบอก 30 - 50 */

    const chestScale =
        THREE.MathUtils.clamp(
            chest / 38,
            0.82,
            1.25
        );


    avatarGroup.scale.set(
        chestScale,
        heightScale,
        chestScale
    );

}


/* =========================================================
   15. เลือกสีเสื้อ
   ========================================================= */

function select3DColor(
    element,
    name,
    hex
) {

    document
        .querySelectorAll(
            '.color-circle'
        )
        .forEach(
            c =>
                c.classList.remove(
                    'selected'
                )
        );


    if (element) {

        element.classList.add(
            'selected'
        );

    }


    selectedColorHex = hex;

    selectedColorName = name;


    const nameElement =
        document.getElementById(
            'selected-color-name'
        );

    if (nameElement) {

        nameElement.innerText =
            name;

    }


    const picker =
        document.getElementById(
            'custom-color-picker'
        );

    if (picker) {

        picker.value = hex;

    }


    update3DFittingModel();

}


/* =========================================================
   16. สีที่กำหนดเอง
   ========================================================= */

function customColorPicked(hex) {

    selectedColorHex = hex;

    selectedColorName =
        'กำหนดเอง';


    const nameElement =
        document.getElementById(
            'selected-color-name'
        );

    if (nameElement) {

        nameElement.innerText =
            'กำหนดเอง';

    }


    update3DFittingModel();

}


/* =========================================================
   17. Animation
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (controls) {

        controls.update();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* =========================================================
   18. Resize
   ========================================================= */

function onWindowResize() {

    const container =
        document.querySelector(
            '.canvas-3d-wrapper'
        );


    if (
        !container ||
        !renderer ||
        !camera
    ) {

        return;

    }


    camera.aspect =
        container.clientWidth /
        container.clientHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

}


/* =========================================================
   19. แสดง/ซ่อนส่วนเสื้อกางเกง
   ========================================================= */

function toggleCutTypeUI() {

    const itemType =
        document.getElementById(
            'item-type-select'
        )?.value;


    const shirtGroup =
        document.getElementById(
            'shirt-parts-group'
        );


    const pantsGroup =
        document.getElementById(
            'pants-price-group'
        );


    if (!shirtGroup ||
        !pantsGroup) {

        update3DFittingModel();

        return;

    }


    if (itemType === 'full') {

        shirtGroup.style.display =
            'block';

        pantsGroup.style.display =
            'block';

    }

    else if (
        itemType === 'shirt'
    ) {

        shirtGroup.style.display =
            'block';

        pantsGroup.style.display =
            'none';

    }

    else if (
        itemType === 'pants'
    ) {

        shirtGroup.style.display =
            'none';

        pantsGroup.style.display =
            'block';

    }


    update3DFittingModel();

}


/* =========================================================
   20. คำนวณราคา
   ========================================================= */

function calculate3DPrice() {

    const itemType =
        document.getElementById(
            'item-type-select'
        )?.value || 'full';


    const fabricSelect =
        document.getElementById(
            'fabric-select'
        );


    const fabricPrice =
        parseInt(
            fabricSelect
                ?.options[
                    fabricSelect.selectedIndex
                ]
                ?.getAttribute(
                    'data-price'
                )
        ) || 200;


    const pantsPrice =
        parseInt(
            document.getElementById(
                'pants-style-select'
            )?.value || 250
        );


    const btnCount =
        parseInt(
            document.getElementById(
                'button-count'
            )?.value || 0
        );


    const hasZip =
        document.getElementById(
            'zip-option'
        )?.checked || false;


    const qty =
        parseInt(
            document.getElementById(
                'custom-quantity'
            )?.value || 1
        );


    let unitPrice = 0;


    if (
        itemType === 'full'
    ) {

        unitPrice =
            fabricPrice +
            pantsPrice;

    }

    else if (
        itemType === 'shirt'
    ) {

        unitPrice =
            fabricPrice;

    }

    else if (
        itemType === 'pants'
    ) {

        unitPrice =
            pantsPrice;

    }


    unitPrice +=
        btnCount * 4;


    if (hasZip) {

        unitPrice += 12;

    }


    const total =
        unitPrice * qty;


    const unitLabel =
        document.getElementById(
            'unit-price-label'
        );

    const totalLabel =
        document.getElementById(
            '3d-calculated-price'
        );


    if (unitLabel) {

        unitLabel.innerText =
            unitPrice;

    }


    if (totalLabel) {

        totalLabel.innerText =
            total + ' บาท';

    }


    return {
        unitPrice,
        total,
        qty
    };

}


/* =========================================================
   21. AI ออกแบบเสื้อ
   ========================================================= */

function generateAI3DShirt() {

    const input =
        document.getElementById(
            'ai-prompt-input'
        );


    const prompt =
        input?.value
            ?.trim()
            .toLowerCase() || '';


    if (!prompt) {

        alert(
            'กรุณากรอกสไตล์ที่ต้องการ'
        );

        return;

    }


    /*
       ระบบนี้เป็น AI แบบจำลอง
       ตรวจคำสั่งแล้วเปลี่ยนค่าของโมเดล
    */


    /* สี */

    if (
        prompt.includes('แดง') ||
        prompt.includes('red')
    ) {

        selectedColorHex =
            '#ef4444';

        selectedColorName =
            'แดง';

    }

    else if (
        prompt.includes('ดำ') ||
        prompt.includes('black')
    ) {

        selectedColorHex =
            '#111111';

        selectedColorName =
            'ดำ';

    }

    else if (
        prompt.includes('ขาว') ||
        prompt.includes('white')
    ) {

        selectedColorHex =
            '#ffffff';

        selectedColorName =
            'ขาว';

    }

    else if (
        prompt.includes('ชมพู') ||
        prompt.includes('pink')
    ) {

        selectedColorHex =
            '#f9a8d4';

        selectedColorName =
            'ชมพู';

    }

    else if (
        prompt.includes('ฟ้า') ||
        prompt.includes('blue')
    ) {

        selectedColorHex =
            '#60a5fa';

        selectedColorName =
            'ฟ้า';

    }

    else if (
        prompt.includes('เขียว') ||
        prompt.includes('green')
    ) {

        selectedColorHex =
            '#10b981';

        selectedColorName =
            'เขียว';

    }


    /* แขน */

    const sleeve =
        document.getElementById(
            'sleeve-style'
        );


    if (sleeve) {

        if (
            prompt.includes(
                'แขนยาว'
            ) ||
            prompt.includes(
                'long sleeve'
            )
        ) {

            sleeve.value =
                'long';

        }

        else if (
            prompt.includes(
                'แขนกุด'
            ) ||
            prompt.includes(
                'sleeveless'
            )
        ) {

            sleeve.value =
                'sleeveless';

        }

        else {

            sleeve.value =
                'short';

        }

    }


    /* คอ */

    const collar =
        document.getElementById(
            'collar-style'
        );


    if (collar) {

        if (
            prompt.includes(
                'คอวี'
            ) ||
            prompt.includes(
                'v-neck'
            )
        ) {

            collar.value =
                'vneck';

        }

        else if (
            prompt.includes(
                'โปโล'
            ) ||
            prompt.includes(
                'polo'
            )
        ) {

            collar.value =
                'polo';

        }

        else {

            collar.value =
                'round';

        }

    }


    const nameElement =
        document.getElementById(
            'selected-color-name'
        );


    if (nameElement) {

        nameElement.innerText =
            selectedColorName;

    }


    const picker =
        document.getElementById(
            'custom-color-picker'
        );


    if (picker) {

        picker.value =
            selectedColorHex;

    }


    update3DFittingModel();


    alert(
        'สร้างแบบ 3D ตามคำสั่งเรียบร้อยแล้ว'
    );

}

                ) {
